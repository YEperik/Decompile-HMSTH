name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and public-release hygiene (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show CLI help
        run: python -m app --help

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -t . -v

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install built wheel into an isolated target
        run: python -m pip install --no-deps --target "$RUNNER_TEMP/hmsth-install" dist/*.whl

      - name: Smoke-test installed CLI
        env:
          PYTHONPATH: ${{ runner.temp }}/hmsth-install
        run: |
          python -m app --help-all
          python -m app doctor

      - name: Check public-release contents
        run: python tools/check_public_release.py
